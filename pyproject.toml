[project]
name = "vitalops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivek9966", email = "johanssonaxel67@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "faker>=40.36.0",
    "fastapi>=0.141.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
vitalops = "vitalops:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
